<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claim — Rajshri Loto Terminal</title>
    <link rel="stylesheet" href="page-common.css" />
</head>

<body>
    <!-- HEADER -->
    <header class="header-container">
        <div class="logo-box">
            <img src="Css/Aassets/image/rajshriloto image.png" alt="Rajshri Win Lot" />
        </div>
        <div class="header-content">
            <div class="top-row">
                <div class="brand-name">RAJSHRI LOTO</div>
                <div class="welcome-msg">WELCOME BADGMYTK</div>
                <div id="clock">Current Time :--:--:--</div>
                <div class="sys-btns">
                    <button class="btn-back" onclick="history.back()">Back</button>
                    <button class="btn-logout" id="logoutBtn">Logout</button>
                </div>
            </div>
            <script> 
              // Quick redirect if not logged in
              if (!localStorage.getItem('rajsri_user')) {
                  window.location.href = 'login.html';
              }
            </script>
            <div class="bottom-row">
                <div class="time-slot-box">08:30 PM</div>
                <div class="nav-results-area">
                    <div class="nav-bar">
                        <button onclick="location.href='accounts.html'">Accounts</button>
                        <button onclick="location.href='passwords.html'">Passwords</button>
                        <button onclick="location.href='TrDetails.html'">TrDetails</button>
                        <button onclick="location.href='reprint.html'">Reprint</button>
                        <button onclick="location.href='cancle.html'">Cancle</button>
                        <button onclick="location.href='result.html'">Result</button>
                        <button class="active" onclick="location.href='claim.html'">Claim</button>
                    </div>
                    <div class="winning-numbers">
                        <div class="num-box yellow">0059</div>
                        <div class="num-box red">0128</div>
                        <div class="num-box d-green">0282</div>
                        <div class="num-box orange">0379</div>
                        <div class="num-box teal">0454</div>
                        <div class="num-box white">0531</div>
                        <div class="num-box pink">0651</div>
                        <div class="num-box gold">0771</div>
                        <div class="num-box l-green">0844</div>
                        <div class="num-box grey">0921</div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="status-bar">
        <span>Prize Claim</span>
        <span class="msg-ok" id="statusMsg">Scan or enter barcode to process claim</span>
    </div>

    <div class="page-wrapper">
        <div class="page-title-bar">
            💰 Claim <span>— Process winning ticket payouts</span>
        </div>

        <!-- SIMPLIFIED CLAIM FORM -->
        <div style="padding:40px 20px;background:#fff;border-bottom:2px solid #000;text-align:center;">
            <div style="max-width:400px;margin:0 auto;">
                <label style="display:block;font-size:16px;font-weight:bold;color:#000;margin-bottom:10px;">Barcode / Ticket Number</label>
                <input type="text" class="pg-input" id="claimBarcode" placeholder="SCAN OR TYPE HERE"
                    style="width:100%;font-size:24px;text-align:center;padding:12px;border:3px solid #000;" maxlength="10" autofocus autocomplete="off" />
                
                <div style="margin-top:25px;display:flex;gap:15px;justify-content:center;">
                    <button class="pg-btn pg-btn-green" style="padding:15px 30px;font-size:18px;font-weight:bold;flex:1;"
                        onclick="processClaim()">✔ PROCESS CLAIM</button>
                    <button class="pg-btn pg-btn-grey" style="padding:15px 20px;font-size:16px;" onclick="clearClaim()">Reset</button>
                </div>
            </div>
        </div>

        <div id="resultPanel" style="display:none;padding:20px;text-align:center;border-top:1px solid #ccc;">
            <div id="resultMsg" style="font-size:20px;font-weight:bold;margin-bottom:15px;"></div>
            <div id="resultDetails" style="font-size:16px;background:#f0f0f0;padding:15px;border-radius:8px;display:inline-block;min-width:300px;"></div>
        </div>
    </div>

    <!-- CLAIM SUCCESS MODAL -->
    <div class="modal-overlay" id="claimSuccessModal">
        <div class="modal-box" style="min-width:360px;">
            <div class="modal-header" style="background:#006600;">
                ✔ Payout Successful
                <button class="modal-close-btn" onclick="closeSuccess()">✕</button>
            </div>
            <div class="modal-body">
                <div id="successDetails" style="font-size:16px;color:#003300;font-weight:bold;line-height:1.6;"></div>
            </div>
            <div class="modal-footer">
                <button class="pg-btn pg-btn-green" onclick="printReceipt()">🖨 Print Payout Receipt</button>
                <button class="pg-btn pg-btn-grey" onclick="closeSuccess()">Done</button>
            </div>
        </div>
    </div>

    <div class="page-action-bar">
        <button class="pg-btn pg-btn-gold" onclick="location.href='index.html'">🏠 Home</button>
        <button class="pg-btn pg-btn-blue" onclick="location.href='result.html'">📊 View Results</button>
        <span style="flex:1;text-align:right;font-size:12px;color:#555;">Rajshri Loto Terminal v1.0</span>
    </div>

    <script>
        // ── CLOCK INTERFACE ──
        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('en-US', { 
                hour12: true, 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit' 
            });
            const clockEl = document.getElementById('clock');
            if (clockEl) clockEl.textContent = "Current Time : " + timeStr;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ── USER INFO ──
        const userStr = localStorage.getItem('rajsri_user');
        const userData = userStr ? JSON.parse(userStr) : {};
        if (userData.username) {
            const welcomeEl = document.querySelector('.welcome-msg');
            if (welcomeEl) welcomeEl.textContent = `WELCOME ${userData.username.toUpperCase()}`;
        }

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('rajsri_user');
            window.location.href = 'login.html';
        });

        // ── BARCODE INPUT (Direct Scan & Enter) ──
        const barcodeInput = document.getElementById('claimBarcode');
        if (barcodeInput) {
            // Trigger on Enter key
            barcodeInput.addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    processClaim();
                }
            });

            // Trigger automatically when 10 characters are scanned/typed
            barcodeInput.addEventListener('input', function() {
                if (this.value.length === 10) {
                    processClaim();
                }
            });

            // Auto-focus on load and keep focus for scanning
            window.addEventListener('DOMContentLoaded', () => {
                barcodeInput.focus();
            });

            // Re-focus after clicking anywhere to ensure next scan works
            document.body.addEventListener('click', (e) => {
                // Don't steal focus if clicking other buttons or inside modal
                if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT' && !document.getElementById('claimSuccessModal').classList.contains('open')) {
                    barcodeInput.focus();
                }
            });
        }

        let isChecking = false;

        async function processClaim() {
            if (isChecking) return;
            
            const barcode = barcodeInput ? barcodeInput.value.trim() : '';
            const statusMsg = document.getElementById('statusMsg');
            const resultPanel = document.getElementById('resultPanel');
            const resultMsg = document.getElementById('resultMsg');
            const resultDetails = document.getElementById('resultDetails');

            if (!barcode) {
                if (barcodeInput) barcodeInput.focus();
                return;
            }

            if (barcode.length < 10 && event && event.type !== 'keypress') {
                return; // Wait for full length if just typing/input
            }

            isChecking = true;
            statusMsg.textContent = "Checking ticket " + barcode + "...";
            statusMsg.className = "msg-ok";
            resultPanel.style.display = 'none';

            try {
                const response = await fetch('https://dhladvertising.site/LuckyCoupanLottery/API/read/claimTickets.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        barcode_number: barcode,
                        username: userData.username || 'anil'
                    })
                });

                if (!response.ok) throw new Error("Server Error: " + response.status);

                const data = await response.json();
                
                if (Array.isArray(data) && data.length > 0) {
                    const res = data[0];
                    if (res.status === true || res.status === "true") {
                        statusMsg.textContent = res.message || "Winning Ticket Processed.";
                        statusMsg.className = "msg-ok";
                        showSuccessModal(res);
                        if (barcodeInput) barcodeInput.value = ''; // Clear for next scan
                    } else {
                        statusMsg.textContent = res.message || "Invalid or Non-winning ticket.";
                        statusMsg.className = "msg-err";
                        
                        resultPanel.style.display = 'block';
                        resultMsg.innerHTML = `<span style="color:#ff3333;">❌ ${res.message || "Ticket Not Found"}</span>`;
                        resultDetails.innerHTML = `
                            <strong>Barcode:</strong> ${barcode}<br>
                            <strong>Status:</strong> Checked at ${new Date().toLocaleTimeString()}<br>
                            <strong>Notes:</strong> This ticket is not a winner or has already been claimed.
                        `;
                        if (barcodeInput) {
                            barcodeInput.value = '';
                            barcodeInput.focus();
                        }
                    }
                } else {
                    throw new Error("No data found for this barcode.");
                }
            } catch (err) {
                console.error("Claim Error:", err);
                statusMsg.textContent = "Error: " + err.message;
                statusMsg.className = "msg-err";
                if (barcodeInput) barcodeInput.focus();
            } finally {
                isChecking = false;
            }
        }

        function showSuccessModal(data) {
            const modal = document.getElementById('claimSuccessModal');
            const details = document.getElementById('successDetails');
            
            details.innerHTML = `
                <div style="font-size:28px; color:#006600; text-align:center; margin-bottom:15px; border-bottom:1px solid #ddd; padding-bottom:10px;">
                    WIN AMOUNT: ₹${data.win_amt}
                </div>
                <div style="display:grid; grid-template-columns:120px 1fr; gap:8px; font-size:14px; text-align:left;">
                    <span>Message:</span> <strong>${data.message}</strong>
                    <span>Barcode:</span> <strong>${data.barcode}</strong>
                    <span>Draw Time:</span> <strong>${data.tck_time}</strong>
                    <span>Next Draw:</span> <strong>${data.nxt_draw}</strong>
                    <span>Date:</span> <strong>${data.record_date}</strong>
                    <span>Retailer:</span> <strong>${data.username}</strong>
                    <span>Points:</span> <strong>${data.amount}</strong>
                </div>
            `;
            
            modal.style.display = 'flex';
        }

        function closeSuccess() {
            document.getElementById('claimSuccessModal').style.display = 'none';
            clearClaim();
        }

        function clearClaim() {
            if (barcodeInput) barcodeInput.value = '';
            document.getElementById('resultPanel').style.display = 'none';
            document.getElementById('statusMsg').textContent = "Scan or enter barcode to process claim";
            document.getElementById('statusMsg').className = "msg-ok";
            if (barcodeInput) barcodeInput.focus();
        }

        function printReceipt() {
           window.print();
        }
    </script>
</body>
</html>
